name: cleanops
description: Application de gestion d'entretien ménager — CleanOps
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.2.7

  # ── PDF ───────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6

  # ── Internationalisation ──────────────────────────────────
  intl: ^0.20.2

  # ── Stockage local ────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── UI ────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── Utilitaires ───────────────────────────────────────────
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  logger: ^2.4.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  image: ^4.3.0
  file_picker: ^13.1.0
  # Téléchargement avec progression (documents joints) et partage natif web
  http: ^1.6.0
  web: ^1.1.1
  liquid_glass_widgets: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

  # Riverpod Code Generation
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.12

  # Lints
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
